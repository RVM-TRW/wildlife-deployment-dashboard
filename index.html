@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');
.wrap{
  --bg:#14140F; --panel:#1C1C14; --panel2:#1A1A12; --line:#33331F; --line2:#2A2A1C; --line3:#22221A;
  --text:#E8E2D0; --text2:#C7C1AD; --muted:#9A947F; --faint:#7A7460; --brass:#C8A24B; --olive:#6E7A45;
  --heading:#F1EAD6; --celltext:#14140F; --hover:#1A1A12; --btn:#2A2A1C;
}
.wrap.light{
  --bg:#EDE7D7; --panel:#F6F1E5; --panel2:#EFE9D9; --line:#D6CDB4; --line2:#DED5BE; --line3:#E4DBC6;
  --text:#26251C; --text2:#3E3B2E; --muted:#726A55; --faint:#938A72; --brass:#9A7B24; --olive:#5C6B3F;
  --heading:#1E1C12; --celltext:#1E1C12; --hover:#EDE6D3; --btn:#E4DBC5;
}
*{box-sizing:border-box}
.wrap{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:22px;max-width:1220px;margin:0 auto;transition:background .2s,color .2s;color-scheme:dark}
.wrap.light{color-scheme:light}
.wrap ::selection{background:var(--brass);color:var(--bg)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid var(--brass);padding-bottom:14px;flex-wrap:wrap}
.hd-l{display:flex;gap:14px;align-items:center}
.mark{font-size:30px;color:var(--brass);line-height:1}
.hd h1{font-family:'Oswald';font-weight:600;letter-spacing:.14em;font-size:26px;margin:0;color:var(--heading)}
.sub{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-top:3px}
.hd-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.meta{font-family:'JetBrains Mono';font-size:11.5px;color:var(--muted);letter-spacing:.04em;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.drl{font-family:'Oswald';font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dinput{background:var(--panel);border:1px solid var(--line);color:var(--text);font-family:'JetBrains Mono';font-size:11.5px;padding:5px 7px}
.dinput:focus{outline:none;border-color:var(--brass)}
.darrow{color:var(--brass)}
.dreset{background:var(--btn);border:1px solid var(--line);color:var(--text);font-family:'JetBrains Mono';font-size:10.5px;padding:5px 9px;cursor:pointer;letter-spacing:.04em}
.dreset:hover{border-color:var(--brass);color:var(--brass)}
.metasub{font-family:'JetBrains Mono';font-size:10.5px;color:var(--muted);letter-spacing:.03em;display:flex;gap:7px;align-items:center}
.rng{color:var(--brass);font-weight:500}
.dot{opacity:.5}
.theme{background:var(--btn);border:1px solid var(--line);color:var(--text);font-family:'JetBrains Mono';font-size:11px;letter-spacing:.05em;padding:6px 12px;cursor:pointer}
.theme:hover{border-color:var(--brass);color:var(--brass)}
.tabs{display:flex;gap:2px;margin:18px 0 20px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;color:var(--muted);font-family:'Oswald';letter-spacing:.08em;font-size:13px;padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brass);border-bottom-color:var(--brass)}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px 18px}
.ptitle{font-family:'Oswald';letter-spacing:.06em;font-size:14px;color:var(--text);text-transform:uppercase;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pnote,.pstat{font-family:'JetBrains Mono';font-size:10.5px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:16px}
.kv{font-family:'Oswald';font-size:34px;font-weight:600;color:var(--brass);line-height:1}
.kl{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.bars{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:120px 1fr 60px;align-items:center;gap:10px;cursor:pointer}
.brow:hover .blab{color:var(--heading)}
.blab{font-size:12px;color:var(--text2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blab.wide{font-size:11.5px}
.btrack{background:var(--bg);height:16px;position:relative;border:1px solid var(--line2);display:flex}
.bfill{height:100%}
.bfill.lv{opacity:.9}
.bval{font-family:'JetBrains Mono';font-size:11.5px;color:var(--text);text-align:right}
.lvn{color:var(--olive);font-size:10px}
.mhelp{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:14px;max-width:860px}
.msort{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.msort label{font-family:'Oswald';letter-spacing:.07em;font-size:11px;color:var(--muted);text-transform:uppercase}
.msort select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 11px;font-family:'Inter';font-size:13px;min-width:200px}
.dirbtn{background:var(--btn);border:1px solid var(--line);color:var(--text);font-family:'JetBrains Mono';font-size:11px;letter-spacing:.04em;padding:7px 12px;cursor:pointer;min-width:112px}
.dirbtn:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
.dirbtn:disabled{opacity:.4;cursor:default}
.mhint{font-family:'JetBrains Mono';font-size:10.5px;color:var(--faint)}
.sortable{cursor:pointer;user-select:none}
.sortable:hover{color:var(--brass)}
.jh.sortable:hover .jhtxt,.jh.msel .jhtxt{filter:brightness(1.35)}
.jh.msel,.corner.msel,.tot.msel{outline:1px solid var(--brass);outline-offset:-1px}
.marr{color:var(--brass);font-size:9px}
.mcards{display:flex;flex-direction:column;gap:10px}
.mcard{background:var(--panel);border:1px solid var(--line);padding:12px 13px}
.mcard-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:11px;border-bottom:1px solid var(--line2);padding-bottom:9px}
.mcard-n{font-family:'Oswald';font-size:17px;letter-spacing:.05em;color:var(--heading)}
.mcard-t{font-family:'JetBrains Mono';font-size:12px;color:var(--brass);white-space:nowrap}
.mcard-t em{color:var(--muted);font-style:normal;font-size:10px}
.mchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px}
.mchip{background:var(--panel2);border:1px solid var(--line2);padding:7px 8px 6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.mchip:active{border-color:var(--brass)}
.mchip-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mchip-top .l{font-family:'JetBrains Mono';font-size:10px;font-weight:700;letter-spacing:.02em}
.mchip-top .c{font-family:'JetBrains Mono';font-size:14px;font-weight:700;color:var(--text)}
.mchip-bar{height:3px;background:var(--bg);border:1px solid var(--line3)}
.mchip-bar i{display:block;height:100%}
.mscroll{overflow-x:auto;border:1px solid var(--line)}
.mtx{border-collapse:collapse;width:100%;font-family:'JetBrains Mono'}
.mtx th,.mtx td{border:1px solid var(--line2)}
.corner{position:sticky;left:0;background:var(--panel);text-align:left;padding:8px 12px;font-size:10px;letter-spacing:.08em;color:var(--muted);z-index:2;min-width:118px}
.jh{padding:8px 0;width:42px;background:var(--panel)}
.jhtxt{font-size:10px;font-weight:700;letter-spacing:.03em;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block;padding:2px}
.mtx .tot{font-size:11px;color:var(--brass);text-align:center;background:var(--panel);font-weight:700;padding:0 8px}
.pn{position:sticky;left:0;background:var(--panel2);color:var(--text);font-size:12px;padding:6px 12px;font-weight:500;white-space:nowrap;z-index:1;font-family:'Inter'}
.cell{width:42px;height:34px;text-align:center;font-size:12px;color:var(--celltext);font-weight:700;cursor:default}
.cell.filled{cursor:pointer}
.cell.filled:hover{outline:2px solid var(--heading);outline-offset:-2px}
.cell.sel{outline:2px solid var(--heading);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px}
.lg{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono'}
.lg i{width:10px;height:10px;display:inline-block}
.psel{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.psel label{font-family:'Oswald';letter-spacing:.08em;font-size:12px;color:var(--muted);text-transform:uppercase}
.psel select,.filters select,.filters input{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 12px;font-family:'Inter';font-size:13px}
.psel select{font-size:15px;min-width:180px}
.pstat{font-size:12px}
.pstat b{color:var(--brass)}
.pgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.pside{display:flex;flex-direction:column;gap:14px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chips li{font-size:12px;color:var(--text2);display:flex;justify-content:space-between;border-bottom:1px dotted var(--line2);padding-bottom:5px}
.chips li span{font-family:'JetBrains Mono';color:var(--brass);font-size:11px}
.chips li.none{color:var(--faint);border:none}
.tl{display:flex;flex-direction:column;max-height:340px;overflow-y:auto}
.tlrow{display:grid;grid-template-columns:96px 52px 1fr 46px;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line3);font-size:12px}
.tlrow.lv{opacity:.55}
.tld{font-family:'JetBrains Mono';font-size:11px;color:var(--text2)}
.tld em{color:var(--faint);font-style:normal;font-size:10px}
.tlj{font-family:'JetBrains Mono';font-size:9.5px;text-align:center;border:1px solid;padding:2px 0;color:var(--text)}
.tlt{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlv{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);text-align:right}
.filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.fgrp{display:flex;flex-direction:column;gap:5px}
.fgrp.grow{flex:1;min-width:180px}
.fgrp label{font-family:'Oswald';letter-spacing:.07em;font-size:10.5px;color:var(--muted);text-transform:uppercase}
.fgrp input{width:100%}
.clr{background:var(--btn);border:1px solid var(--line);color:var(--text);padding:8px 14px;cursor:pointer;font-size:12px;font-family:'Oswald';letter-spacing:.06em}
.clr:hover{border-color:var(--brass)}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--brass);color:var(--text);font-size:12px;padding:5px 10px;margin-bottom:10px}
.pill b{color:var(--brass)}
.pill button{background:none;border:none;color:var(--brass);cursor:pointer;font-size:15px;line-height:1}
.count{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);margin-bottom:8px}
.tblwrap{overflow-x:auto;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
.tbl th{background:var(--panel);text-align:left;padding:9px 12px;font-family:'Oswald';letter-spacing:.06em;font-size:11px;color:var(--muted);text-transform:uppercase;cursor:pointer;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th:hover{color:var(--brass)}
.tbl th.srt{color:var(--brass)}
.arr{font-size:9px}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line3);vertical-align:top}
.tbl tr:hover td{background:var(--hover)}
.tbl tr.lvr td{opacity:.5}
.mono{font-family:'JetBrains Mono';font-size:11px;color:var(--text2);white-space:nowrap}
.mono em{font-style:normal;color:var(--faint);font-size:10px}
.pcol{color:var(--heading);font-weight:500;white-space:nowrap}
.tcol{color:var(--muted);font-size:11.5px;white-space:nowrap}
.dcol{color:var(--text2)}
.vc{color:var(--muted)}
.jtag{font-family:'JetBrains Mono';font-size:10px;border:1px solid;padding:2px 7px;white-space:nowrap}
.empty{text-align:center;color:var(--faint);padding:28px}
.ft{margin-top:20px;padding-top:14px;border-top:1px solid var(--line2);font-family:'JetBrains Mono';font-size:10.5px;color:var(--faint);letter-spacing:.02em}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .pgrid{grid-template-columns:1fr}
  .brow{grid-template-columns:96px 1fr 48px}

}

  .msort select{min-width:0;flex:1}
  .tabs{overflow-x:auto}
  .tab{padding:10px 12px;white-space:nowrap}
}
